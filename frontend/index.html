<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Upload System</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
    input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #0056b3; }
    #status { margin-top: 15px; word-break: break-all; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Upload CV</h2>
    <form id="uploadForm">
      <div class="form-group">
        <label for="name">Full Name (name):</label>
        <input type="text" id="name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label for="cvNumber">CV Number (cv_number):</label>
        <input type="number" id="cvNumber" required placeholder="e.g. 101">
      </div>
      <div class="form-group">
        <label for="cv">CV File (PDF/Doc):</label>
        <input type="file" id="cv" accept=".pdf,.doc,.docx" required>
      </div>
      <button type="submit">Submit CV</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = 'black';
      statusDiv.innerText = 'Uploading file...';

      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);
      formData.append('cvNumber', document.getElementById('cvNumber').value);
      formData.append('cv', document.getElementById('cv').files[0]);

      try {
        const response = await fetch('http://${window.location.hostname}:3010/upload-cv', {
        method: 'POST',
        body: formData
        });

        const result = await response.json();

        if (response.ok) {
          statusDiv.style.color = 'green';
          statusDiv.innerHTML = `File uploaded & DB record saved! <br><a href="${result.s3Url}" target="_blank">View File in S3</a>`;
        } else {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'Error: ' + (result.error || 'Upload failed');
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Server communication error.';
      }
    });
  </script>
</body>
</html>
